services:
  crysync:
    build: .
    ports:
      - "873:873"
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "873"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./conf:/conf:ro
      - crysync-keys:/keys
      - crysync-meta:/meta
      - crysync-data:/data

volumes:
  crysync-keys:
  crysync-meta:
  crysync-data:
