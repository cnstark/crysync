services:
  crysync:
    # 直接使用 GHCR 已发布镜像（CI 由 tag 触发构建）；生产建议固定版本号如 :0.1.0
    image: ghcr.io/cnstark/crysync:latest
    ports:
      - "873:873"
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "873"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./conf:/conf:ro
      - crysync-keys:/keys
      - crysync-meta:/meta
      - crysync-data:/data

volumes:
  crysync-keys:
  crysync-meta:
  crysync-data:
