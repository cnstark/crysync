# CrySync docker compose 部署示例（rsync + WebDAV 双前端）
# 使用方式：复制本文件为 docker-compose.yml（复制品含本地环境信息，已被 gitignore）
#   cp docker-compose.example.yml docker-compose.yml
# 前置：配置文件已就绪——复制并编辑 conf/crysync.yaml.example 为 conf/crysync.yaml
#（front 节含 rsync 与 webdav 两前端（至少启用一个）；密码、模块名、后端类型按需修改，
#  权限 0600；两种后端均按 bucket_depth 分桶并在后端 meta/ 保存加密 Meta 快照，WebDAV 后端无需 /data 卷）
# 端口：873 = rsync 前端；8080 = WebDAV 前端（按需开放，或仅暴露在局域网/反代后）
# 卷权限：entrypoint 自动探测挂载目录属主并降权运行，挂载数据目录属主需一致且运行身份具有写权限；
#   可选 PUID/PGID 环境变量显式指定运行身份；显式写 user: 则跳过探测（需自行保证权限）

services:
  crysync:
    # GHCR 官方镜像；生产建议固定版本号（从已发布版本中选择）
    image: ghcr.io/cnstark/crysync:latest
    ports:
      - "873:873"            # rsync 前端；宿主端口被占用时改左侧（如 "8873:873"），rsync --port 同步改
      - "8080:8080"          # WebDAV 前端；同左（如 "8875:8080"），客户端 URL 端口同步改
    # 目录属主为 root（dockerd 自动创建目录）时以 root 运行并打印警告，建议宿主机 chown
    # 需要显式身份时配置 PUID/PGID；不会自动 chown 挂载目录。
    # environment:
    #   PUID: "1000"
    #   PGID: "1000"
    restart: unless-stopped
    # 健康检查：任一前端（rsync 873 / WebDAV 8080）在监听即健康；
    # 只启用其中一个前端时，另一条 nc 探测失败不影响（|| 语义）
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 873 || nc -z 127.0.0.1 8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./conf:/conf:ro       # 配置目录（crysync.yaml 所在，只读挂载）
      - crysync-keys:/keys    # 模块密钥（与元数据、数据物理分离的独立卷）
      - crysync-meta:/meta    # SQLite 元数据库（每模块一个）
      # Dir 后端数据（blob 及 data/<模块>/meta/ 下的加密 Meta 备份）：不用命名卷，
      # bind mount 宿主目录（先确认与密钥、元数据卷的权限匹配）：
      - /srv/crysync/data:/data
      # 全部模块用 WebDAV 后端时去掉上面这行，无需 /data
      # bind mount 示例（属主和权限须匹配运行身份）：
      # - /srv/crysync/keys:/keys
      # - /srv/crysync/meta:/meta

volumes:
  crysync-keys:
  crysync-meta:
